# Default values for contrast-vulnerable-services.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

contrast:
  serverEnvironment: ""

mysql:
  rootPassword: cargocats
  database: db
  user: cargocats
  password: cargocats

cargocatsDataservice:
  image: dataservice:latest 
  name: dataservice

frontgateservice:
  image: frontgateservice:latest
  name: frontgateservice

webhookservice:
  image: webhookservice:latest 
  name: webhookservice

imageservice:
  image: imageservice:latest
  name: imageservice

labelservice:
  image: labelservice:latest
  name: labelservice

docservice:
  image: docservice:latest
  name: docservice

reportservice:
  image: reportservice:latest
  name: reportservice

aiservice:
  image: aiservice:latest
  name: aiservice

ollama:
  model: smollm2:135m

ai:
  # Set to false to disable the explicit chatbot (aiservice /api/ai/openai)
  chatbotEnabled: true
  # Set to false to disable the shadow AI insight injection in reportservice
  shadowEnabled: true

opensearch:
  initialAdminPassword: "Contrast@123!"

fluent-bit:
  config:
    inputs: |
      [INPUT]
          Name tail
          Path /var/log/containers/*.log
          multiline.parser docker, cri
          Tag kube.*
          Mem_Buf_Limit 100MB
          Skip_Long_Lines On

      [INPUT]
          Name systemd
          Tag host.*
          Systemd_Filter _SYSTEMD_UNIT=kubelet.service
          Read_From_Tail On
    outputs: |
      [OUTPUT]
          Name  opensearch
          Match *
          Host  opensearch-node
          Port  9200
          Index logs
          Replace_Dots On
          tls On
          tls.verify Off
          HTTP_User admin
          HTTP_Passwd Contrast@123!
          Suppress_Type_Name On

falco:
  # Falco runs by default via the modern eBPF (CO-RE) driver, which needs kernel
  # BTF (/sys/kernel/btf/vmlinux) rather than kernel headers, so nothing is
  # compiled on the node. Docker Desktop's LinuxKit kernel ships BTF, and it has
  # neither kernel headers nor a prebuilt module, so modern_ebpf is the only
  # driver that can work here. Do not switch `kind` to kmod or ebpf on Docker
  # Desktop, both need to build something the node cannot build.
  #
  # The subchart must stay at >= 9.x (appVersion >= 0.44.0). Falco <= 0.43
  # cannot load the modern probe here at all: the BPF verifier rejects
  # sendmmsg_x/recvmmsg_x for needing 1000001 instructions against its 1000000
  # limit, libbpf then fails the whole bpf_probe object, and Falco exits with
  # "Initialization issues during scap_init". On chart 5.0.0 (Falco 0.41.0) that
  # presented as a permanent CrashLoopBackOff, and because the doomed probe load
  # also blew through the 1Gi memory limit it surfaced first as an unexplained
  # OOMKill (exit 137), which hides the real error. Fixed in libs 0.25.0, shipped
  # in Falco 0.44.0. See https://github.com/falcosecurity/falco/issues/3829
  #
  # Stock resources are fine on 0.44.1, no override needed. Measured steady state
  # on Docker Desktop is ~150Mi against the subchart's 1Gi default limit.
  #
  # The `condition: falco.enabled` on the dependency in Chart.yaml makes this a
  # real toggle. Set enabled: false for an environment whose kernel lacks BTF.
  enabled: true
  driver:
    kind: modern_ebpf
  # Falco's own falco.yaml settings live under this nested `falco:` key (the
  # subchart's key). JSON output is required: fluent-bit parses each alert's
  # JSON into fields (priority, rule, output_fields.*) that get indexed into
  # OpenSearch, and the WAF/EDR/ADR dashboards filter on exactly those fields.
  # With plain-text output the fields are absent and the Falco panels are empty.
  falco:
    json_output: true

ingress-nginx:
  controller:
    admissionWebhooks:
      enabled: false
    ingressClass: nginx
    ingressClassResource:
      name: nginx  
      enabled: true
      default: false
      controllerValue: "k8s.io/ingress-nginx"
    config:
      allow-snippet-annotations: "true"
      enable-modsecurity: "true"
      enable-owasp-modsecurity-crs: "true"
      modsecurity-snippet: |-
        SecRuleEngine DetectionOnly
        SecAuditEngine RelevantOnly 
        SecAuditLog /dev/stdout
        SecAuditLogFormat JSON
        SecAuditLogType Serial
        SecAuditLogParts ABIJDEFHZ
        SecDebugLog /dev/stdout
        SecDebugLogLevel 3
        SecArgumentsLimit 100
        SecRequestBodyAccess On
        SecRequestBodyJsonDepthLimit 512
        SecRequestBodyNoFilesLimit 1048576