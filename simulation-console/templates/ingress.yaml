apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simulation-console-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    # Delete All pages through every issue in the org and then deletes objects one at a
    # time with retries, which routinely runs past nginx's 60s default. Without these the
    # browser gets a 504 and reports a network error while the deletion is still running
    # server side, which looks exactly like "the button does nothing".
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: zapproxy.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zapproxy
                port:
                  number: 80
    - host: console.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: console-ui
                port:
                  number: 5000
