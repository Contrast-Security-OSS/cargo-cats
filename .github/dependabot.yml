# Dependabot is disabled for this repository.
# cargo-cats is a purposefully vulnerable application used for security tooling
# testing. Dependency vulnerabilities are intentional and Dependabot PRs are not relevant.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/services/dataservice"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "maven"
    directory: "/services/frontgateservice"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/services/docservice"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/services/webhookservice"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/services/contrastdatacollector"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/services/console-ui"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/services/labelservice"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "nuget"
    directory: "/services/imageservice"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/services/console-ui"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/services/contrastdatacollector"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/services/dataservice"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/services/docservice"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/services/exploit-server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/services/frontgateservice"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/services/imageservice"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/services/labelservice"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/services/webhookservice"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /services/aiservice
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /services/reportservice
    schedule:
      interval: weekly

  - package-ecosystem: maven
    directory: /services/aiservice
    schedule:
      interval: daily
    groups:
      dev-dependencies:
          applies-to: version-updates
          patterns:
              - '*'
          dependency-type: development
      production-dependencies:
          applies-to: version-updates
          patterns:
              - '*'
          dependency-type: production
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 5
      include:
          - '*'
      exclude:
          - react

  - package-ecosystem: maven
    directory: /services/reportservice
    schedule:
      interval: daily
    groups:
      dev-dependencies:
          applies-to: version-updates
          patterns:
              - '*'
          dependency-type: development
      production-dependencies:
          applies-to: version-updates
          patterns:
              - '*'
          dependency-type: production
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 5
      include:
          - '*'
      exclude:
          - react
