framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    serializer:
        enabled: true

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
